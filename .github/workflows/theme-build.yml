name: Theme CSS build

on:
  push:
    branches:
      - feature/theme-foundation
    paths:
      - 'src/styles/**'
      - 'package.json'
      - '.github/workflows/theme-build.yml'

permissions:
  contents: write

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/theme-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CSS build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build production CSS
        run: npm run build:css

      - name: Commit compiled CSS when changed
        shell: bash
        run: |
          if git diff --quiet -- style/edvorya.css; then
            echo "Compiled CSS is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style/edvorya.css
          git commit -m "build: refresh compiled Edvorya CSS"
          git push origin HEAD:feature/theme-foundation
