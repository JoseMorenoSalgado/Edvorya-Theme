name: Moodle 5.0-5.2 compatibility matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/moodle-compatibility-matrix.yml'
      - 'classes/**'
      - 'config.php'
      - 'lang/**'
      - 'layout/**'
      - 'lib.php'
      - 'pix/**'
      - 'settings.php'
      - 'src/styles/**'
      - 'style/**'
      - 'templates/**'
      - 'tests/behat/**'
      - 'version.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edvorya-theme-moodle-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Moodle ${{ matrix.moodle }} + PHP 8.3 + MariaDB 10.11
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: '5.0'
            branch: MOODLE_500_STABLE
            slug: moodle500
            port: '127.0.0.1:18050'
            themepath: theme/edvorya
            behatclidir: admin/tool/behat/cli
          - moodle: '5.1'
            branch: MOODLE_501_STABLE
            slug: moodle501
            port: '127.0.0.1:18051'
            themepath: public/theme/edvorya
            behatclidir: public/admin/tool/behat/cli
          - moodle: '5.2'
            branch: MOODLE_502_STABLE
            slug: moodle502
            port: '127.0.0.1:18052'
            themepath: public/theme/edvorya
            behatclidir: public/admin/tool/behat/cli

    env:
      MOODLE_DOCKER_DB: mariadb
      MOODLE_DOCKER_DB_VERSION: '10.11'
      MOODLE_DOCKER_PHP_VERSION: '8.3'
      MOODLE_DOCKER_BROWSER: chrome
      MOODLE_DOCKER_TIMEOUT_FACTOR: '2'
      MOODLE_DOCKER_WEB_HOST: localhost
      MOODLE_DOCKER_WEB_PORT: ${{ matrix.port }}

    steps:
      - name: Checkout Edvorya Theme
        uses: actions/checkout@v4
        with:
          path: theme-source

      - name: Checkout Moodle ${{ matrix.moodle }}
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: ${{ matrix.branch }}
          path: moodle

      - name: Checkout Moodle Docker
        uses: actions/checkout@v4
        with:
          repository: moodlehq/moodle-docker
          path: moodle-docker

      - name: Install Edvorya Theme into Moodle codebase
        shell: bash
        run: |
          set -euo pipefail
          THEME_TARGET="moodle/${{ matrix.themepath }}"
          rm -rf "$THEME_TARGET"
          mkdir -p "$THEME_TARGET"
          rsync -a --delete --exclude='.git' theme-source/ "$THEME_TARGET/"

          test -f "$THEME_TARGET/version.php"
          test -f "$THEME_TARGET/config.php"
          test -f "$THEME_TARGET/style/edvorya.css"
          test -f "$THEME_TARGET/style/edvorya-shell.css"

          grep -F '$plugin->requires = 2025041400;' "$THEME_TARGET/version.php"
          grep -F '$plugin->supported = [500, 502];' "$THEME_TARGET/version.php"
          grep -F '$THEME->parents = ['"'"'boost'"'"'];' "$THEME_TARGET/config.php"

      - name: Prepare isolated Moodle configuration
        shell: bash
        run: |
          set -euo pipefail
          cp moodle-docker/config.docker-template.php moodle/config.php

          # Force the compatibility site, including Behat, to render theme_edvorya.
          sed -i "/require_once(__DIR__ . '\/lib\/setup.php');/i\$CFG->theme = 'edvorya';" moodle/config.php

          cat > moodle-docker/edvorya-compat-runtime.ini <<'INI'
          max_input_vars=5000
          INI

          cat > moodle-docker/local.yml <<'YAML'
          services:
            webserver:
              volumes:
                - ./edvorya-compat-runtime.ini:/usr/local/etc/php/conf.d/zz-edvorya-compat-runtime.ini:ro
          YAML

          echo "MOODLE_DOCKER_WWWROOT=${GITHUB_WORKSPACE}/moodle" >> "$GITHUB_ENV"
          echo "MOODLE_DOCKER_BEHAT_FAILDUMP=${GITHUB_WORKSPACE}/behat-faildumps" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=edvorya-theme-${{ matrix.slug }}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

          mkdir -p "${GITHUB_WORKSPACE}/behat-faildumps"
          chmod 0777 "${GITHUB_WORKSPACE}/behat-faildumps"

      - name: Start Moodle, MariaDB and Selenium
        working-directory: moodle-docker
        shell: bash
        run: |
          set -euo pipefail
          bin/moodle-docker-compose up -d
          bin/moodle-docker-wait-for-db

      - name: Verify runtime requirements
        working-directory: moodle-docker
        shell: bash
        run: |
          set -euo pipefail
          bin/moodle-docker-compose exec -T webserver php -r 'echo "PHP=" . PHP_VERSION . PHP_EOL; if (version_compare(PHP_VERSION, "8.3.0", "<")) {exit(1);}'
          bin/moodle-docker-compose exec -T db mariadb --version
          bin/moodle-docker-compose exec -T webserver php -r 'if ((int) ini_get("max_input_vars") < 5000) {fwrite(STDERR, "max_input_vars must be >= 5000\n"); exit(1);} echo "max_input_vars=" . ini_get("max_input_vars") . PHP_EOL;'

      - name: Initialize Moodle ${{ matrix.moodle }} Behat site with Edvorya
        working-directory: moodle-docker
        shell: bash
        run: |
          set -euo pipefail
          bin/moodle-docker-compose exec -T webserver \
            php ${{ matrix.behatclidir }}/init.php --disable-composer --no-axe \
            2>&1 | tee "${GITHUB_WORKSPACE}/behat-init-${{ matrix.moodle }}.log"

      - name: Validate Edvorya Dashboard shell
        working-directory: moodle-docker
        shell: bash
        run: |
          set -euo pipefail
          bin/moodle-docker-compose exec -T -u www-data webserver \
            php ${{ matrix.behatclidir }}/run.php \
            --name='Dashboard uses the contextual Edvorya experience without horizontal overflow' \
            --format=progress \
            2>&1 | tee "${GITHUB_WORKSPACE}/dashboard-${{ matrix.moodle }}.log"

      - name: Validate Edvorya Design System containment
        working-directory: moodle-docker
        shell: bash
        run: |
          set -euo pipefail
          bin/moodle-docker-compose exec -T -u www-data webserver \
            php ${{ matrix.behatclidir }}/run.php \
            --name='Wide Moodle tables use internal scrolling instead of expanding the phone viewport' \
            --format=progress \
            2>&1 | tee "${GITHUB_WORKSPACE}/design-system-${{ matrix.moodle }}.log"

      - name: Upload compatibility diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edvorya-moodle-${{ matrix.moodle }}-compatibility-diagnostics
          path: |
            behat-init-${{ matrix.moodle }}.log
            dashboard-${{ matrix.moodle }}.log
            design-system-${{ matrix.moodle }}.log
            behat-faildumps
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect container logs on failure
        if: failure()
        working-directory: moodle-docker
        shell: bash
        run: |
          bin/moodle-docker-compose ps || true
          bin/moodle-docker-compose logs --no-color --tail=400 || true

      - name: Destroy isolated Moodle test environment
        if: always()
        working-directory: moodle-docker
        shell: bash
        run: |
          bin/moodle-docker-compose down -v --remove-orphans || true
