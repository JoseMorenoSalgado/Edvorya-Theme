name: Theme quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/theme-foundation
    paths-ignore:
      - 'docs/QUALITY_STATUS.md'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/theme-foundation

      - name: Validate PHP syntax
        shell: bash
        run: |
          php -v
          find . -type f -name '*.php' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CSS build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Rebuild production CSS
        run: npm run build:css

      - name: Verify compiled CSS is committed
        run: git diff --exit-code -- style/edvorya.css

      - name: Record phase-one static validation
        if: github.event_name == 'push'
        shell: bash
        run: |
          cat > docs/QUALITY_STATUS.md <<'EOF'
          # Phase-one static validation

          This file is generated only after the automated foundation checks complete successfully.

          - PHP syntax (`php -l`): PASS
          - Tailwind production build: PASS
          - Compiled CSS matches `src/styles/tailwind.css`: PASS

          These static checks do not replace installation and runtime regression testing on Moodle 5.2.
          EOF

          if [ -z "$(git status --porcelain -- docs/QUALITY_STATUS.md)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/QUALITY_STATUS.md
          git commit -m "ci: record phase-one static validation"
          git push origin HEAD:feature/theme-foundation
